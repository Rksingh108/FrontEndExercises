<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to persistent</title>
</head>
<body>
    <h1>Personal details</h1>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for ="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label><br><br>  
        <label for ="Home town">Home town:</label>
        <select name="city" id="city" >
            <option value="city1">City 1</option>
            <option value="city2">City 2</option>
            <option value="city3">City 3</option>

        </select>
        <br>
        <label for ="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="2" cols="50" required></textarea><br><br>
        <label for="skills">Skills:</label>
        <input type="checkbox" id="skills" name="skills" value="skill1" required>
        <label for="skills">java</label>
        <input type="checkbox" id="skills" name="skills" value="skill2" required>
        <label for="skills">Python</label>
        <input type="checkbox" id="skills" name="skills" value="skill3" required>
        <label for="skills">JavaScript</label><br><br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" required><br><br>
        <button type="button">Submit</button>
    </form>
    

    
</body>
</html>
