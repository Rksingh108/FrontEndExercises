<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids and Container</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<body>
    <div class="container">
        <div class="row">
            <div class="col-4 border">col one</div>
            <div class="col-4 border">col two</div>
            <div class="col-4 border ">col three</div>
        </div>
        <div class="row">
            <div class="col-6 border">Col - 6</div>
            <div class="col-6 border">Col - 6</div>
        </div>
        <div class="row">
            <div class="col-3 border">col 2</div>
            <div class="col-9 border">col 9</div>
        </div>
        <div class="row">
            <div class="col-12 border">col 12</div>
        </div>
        <div class="row">
            <div class="col-2 border">col 2</div>
            <div class="col-4 border">col 4</div>
            <div class="col-6 border">col 6</div>
        </div>
        <div class="row">
            <div class="col-12 border">12 full width</div>
            <div class="col-md-6 border">half width medium screen</div>
            <div class="col-lg-4 border">4 columns</div>
        </div>
        
    </div>
    <div class="row">
        <div class="col border">col test 1</div>
        <div class="col border">col test 2</div>
        <div class="col border">col test 3</div>
    </div>

    <button class="btn btn-primary">click me</button>
    <button class="btn btn-secondary">click me</button>
    <button class="btn btn-success">click me</button>
    <button class="btn btn-danger">click me</button>
    <button class="btn btn-warning">click me</button>
    <button class="btn btn-info">click me</button>
    <button class="btn btn-white">click me</button>
    <button class="btn btn-dark">click me</button>

    <button type="button" class="btn btn-outline-primary">pm one</button>
    <button type="button" class="btn btn-outline-secondary">secondary</button>
    <button type="button" class="btn btn-outline-success">success</button>
    <button type="button" class="btn btn-outline-danger">danger</button>

    <button type="button" class="btn btn-primary btn-lg">btn one</button>
    
    
</body>
</html>
